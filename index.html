<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
/* Same look as the Project Tracker: a dark job-sign band over an aluminum page; content in a 1120px column;
   phones get a bottom tab bar. A project's company recolors the sign and the buttons. Data colors (the
   status groups, overdue red) are the same on every project. */
:root {
  --page: #e8ecef; --surface: #fbfcfc; --surface-2: #f0f3f5; --ink: #15212c; --ink-2: #455463; --ink-3: #66737f;
  --rule: #d5dce1; --track: #dae1e6;
  --brand: #0b7a75; --brand-ink: #ffffff; --brand-text: #0b7a75; --brand-soft: #dceeec;
  --co-uc: #a13129; --co-asf: #8cc63f;
  --over: #c13a31; --over-soft: #f7e0dd; --warn: #9a6200; --warn-fill: #f2b233; --warn-soft: #f8ebcf; --good: #2b7a3e; --good-soft: #ddefe1; --on-over: #ffffff;
  --g-cleared: #2b7a3e; --g-review: #2e5fa3; --g-revise: #c55a11; --g-send: #e3a52a; --g-void: #a5afb8; --g-other: #c9d0d6;
  --g-review-soft: #e1e9f5; --g-revise-soft: #f8e6da;
  --sign: #17232e; --sign-2: #243341; --sign-ink: #f3f6f8; --sign-ink-2: #afbdc9; --sign-accent: #5fd0c8; --sign-kicker: var(--sign-ink-2);
  --sign-fill: rgba(255, 255, 255, .04);
  --dot-ok: #4cc27a; --dot-busy: #5fd0c8; --dot-warn: #f2b233; --dot-err: #ff7b72;
  --scrim: rgba(12, 20, 27, .46); --shadow: 0 18px 50px rgba(16, 28, 38, .22);
  --font: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r-card: 10px; --r-ctl: 7px; --tabbar-h: 58px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0e1419; --surface: #151d25; --surface-2: #1b2530; --ink: #e5ebf0; --ink-2: #a8b5c1; --ink-3: #7e8c99;
    --rule: #26323d; --track: #2a3743;
    --brand: #3db3ab; --brand-ink: #062321; --brand-text: #3db3ab; --brand-soft: #123532; --co-uc: #c2453b;
    --over: #f06a60; --over-soft: #3a1d1b; --warn: #f2b233; --warn-fill: #f2b233; --warn-soft: #3a2e12; --good: #59b86e; --good-soft: #17301d; --on-over: #2a0c0a;
    --g-cleared: #4fae66; --g-review: #6d9de3; --g-revise: #e8823d; --g-send: #e9b142; --g-void: #6b7783; --g-other: #4a5560;
    --g-review-soft: #1b2a40; --g-revise-soft: #3a2416;
    --sign: #1a2530; --sign-2: #263543; --sign-ink: #f3f6f8; --sign-ink-2: #a9b7c3;
    --scrim: rgba(0, 0, 0, .6); --shadow: 0 18px 50px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0e1419; --surface: #151d25; --surface-2: #1b2530; --ink: #e5ebf0; --ink-2: #a8b5c1; --ink-3: #7e8c99;
  --rule: #26323d; --track: #2a3743;
  --brand: #3db3ab; --brand-ink: #062321; --brand-text: #3db3ab; --brand-soft: #123532; --co-uc: #c2453b;
  --over: #f06a60; --over-soft: #3a1d1b; --warn: #f2b233; --warn-fill: #f2b233; --warn-soft: #3a2e12; --good: #59b86e; --good-soft: #17301d; --on-over: #2a0c0a;
  --g-cleared: #4fae66; --g-review: #6d9de3; --g-revise: #e8823d; --g-send: #e9b142; --g-void: #6b7783; --g-other: #4a5560;
  --g-review-soft: #1b2a40; --g-revise-soft: #3a2416;
  --sign: #1a2530; --sign-2: #263543; --sign-ink: #f3f6f8; --sign-ink-2: #a9b7c3;
  --scrim: rgba(0, 0, 0, .6); --shadow: 0 18px 50px rgba(0, 0, 0, .5); color-scheme: dark;
}
/* Company themes: the sign, buttons, links and focus rings take the company's colors. */
:root[data-company="uc"] {
  --sign: #a13129; --sign-2: #bc4a41; --sign-ink: #ffffff; --sign-ink-2: #f3d0cc; --sign-accent: #ffffff;
  --brand: #a13129; --brand-ink: #ffffff; --brand-text: #a13129; --brand-soft: #f6e3e1;
}
:root[data-company="asf"] {
  --sign: #8cc63f; --sign-2: #79b02e; --sign-ink: #142007; --sign-ink-2: #2e4710; --sign-accent: #142007; --sign-kicker: #2e4710;
  --sign-fill: rgba(255, 255, 255, .22); --dot-ok: #1d6b2c; --dot-busy: #0e5f5a; --dot-warn: #7a4f00; --dot-err: #b42318;
  --brand: #8cc63f; --brand-ink: #1a2908; --brand-text: #437013; --brand-soft: #eef6e2;
}
@media (prefers-color-scheme: dark) {
  :root[data-company="uc"]:not([data-theme="light"]) { --sign: #84271f; --sign-2: #9c3a32; --sign-ink-2: #ebc3be; --brand: #b43a31; --brand-text: #f5b3ac; --brand-soft: #3d1f1c; }
  :root[data-company="asf"]:not([data-theme="light"]) { --sign: #2e4517; --sign-2: #44622a; --sign-ink: #ffffff; --sign-ink-2: #c8dcae; --sign-accent: #8cc63f; --sign-kicker: #a6d76c;
    --sign-fill: rgba(255, 255, 255, .04); --dot-ok: #4cc27a; --dot-busy: #5fd0c8; --dot-warn: #f2b233; --dot-err: #ff7b72; --brand-text: #a6d76c; --brand-soft: #222f17; }
}
:root[data-company="uc"][data-theme="dark"] { --sign: #84271f; --sign-2: #9c3a32; --sign-ink-2: #ebc3be; --brand: #b43a31; --brand-text: #f5b3ac; --brand-soft: #3d1f1c; }
:root[data-company="asf"][data-theme="dark"] { --sign: #2e4517; --sign-2: #44622a; --sign-ink: #ffffff; --sign-ink-2: #c8dcae; --sign-accent: #8cc63f; --sign-kicker: #a6d76c;
  --sign-fill: rgba(255, 255, 255, .04); --dot-ok: #4cc27a; --dot-busy: #5fd0c8; --dot-warn: #f2b233; --dot-err: #ff7b72; --brand-text: #a6d76c; --brand-soft: #222f17; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
  font-stretch: 100%; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sign); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand-text); outline-offset: 2px; }
a { color: var(--brand-text); text-underline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.cond { font-stretch: 80%; }
.muted { color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- job sign ---------- */
.sign { background: var(--sign); color: var(--sign-ink); padding-top: env(safe-area-inset-top, 0px); }
.sign .co { margin: 0 0 7px; font-size: 12.5px; font-weight: 700; font-stretch: 92%; letter-spacing: .09em; text-transform: uppercase; color: var(--sign-kicker); }
.sign .co .cs { display: none; }
.sign .wrap { padding-block: 22px 0; }
.sign-top { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
.sign h1 { margin: 0; font-size: clamp(23px, 3.6vw, 34px); line-height: 1.06; font-weight: 800; font-stretch: 112%;
  letter-spacing: -.01em; text-wrap: balance; max-width: 30ch; overflow-wrap: anywhere; }
.sign .addr { margin: 8px 0 0; color: var(--sign-ink-2); font-size: 14.5px; }
.sign .addr:empty { display: none; }
.plates { display: flex; flex-wrap: wrap; gap: 8px 10px; margin-top: 16px; }
.plates:empty { display: none; }
.plate { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 11px 7px; border: 1px solid var(--sign-2);
  border-radius: 6px; background: var(--sign-fill); max-width: 100%; }
.plate .k { font-stretch: 80%; font-size: 12.5px; color: var(--sign-ink-2); letter-spacing: .02em; }
.plate .v { font-weight: 700; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.sync { flex: none; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--sign-2); background: transparent;
  color: var(--sign-ink); border-radius: 999px; padding: 6px 12px 6px 10px; font-size: 13px; font-stretch: 90%; white-space: nowrap; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sign-ink-2); }
.sync[data-state="saved"] .dot { background: var(--dot-ok); }
.sync[data-state="saving"] .dot, .sync[data-state="loading"] .dot { background: var(--dot-busy); animation: pulse 1.1s ease-in-out infinite; }
.sync[data-state="offline"] .dot { background: var(--dot-warn); }
.sync[data-state="error"] .dot { background: var(--dot-err); }
.sync[data-state="view"] .dot, .sync[data-state="preview"] .dot { background: transparent; border: 1.5px solid var(--sign-ink-2); }
@keyframes pulse { 50% { opacity: .35; } }
.sign-actions { display: flex; gap: 8px; align-items: center; flex: none; }
.crumb { display: inline-flex; align-items: center; gap: 4px; margin: -4px 0 12px; padding: 5px 13px 5px 7px; border: 1px solid var(--sign-2);
  border-radius: 999px; background: var(--sign-fill); color: var(--sign-ink); font-size: 14px; font-weight: 600; font-stretch: 92%; }
.crumb:hover { background: var(--sign-2); }
.crumb svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.tabs { display: flex; gap: 4px; margin-top: 18px; overflow-x: auto; scrollbar-width: none; }
.tabs:empty { margin-top: 0; padding-bottom: 22px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: transparent; color: var(--sign-ink-2); padding: 10px 14px 12px; font-size: 15px; font-weight: 600;
  border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button:hover { color: var(--sign-ink); }
.tabs button[aria-current="page"] { color: var(--sign-ink); border-bottom-color: var(--sign-accent); }
.tabs .n { font-variant-numeric: tabular-nums; opacity: .75; font-weight: 600; margin-left: 4px; }
.tabbar { display: none; }

/* ---------- layout ---------- */
.main { padding-block: 22px 64px; outline: none; }
.stack { display: grid; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-card); padding: 18px 20px; min-width: 0; }
.card h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.005em; text-wrap: balance; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.card-head p { margin: 2px 0 0; color: var(--ink-3); font-size: 13.5px; }
.banner { margin: 16px auto 0; }
.banner .note { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }

/* ---------- buttons & chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 7px 14px;
  border-radius: var(--r-ctl); border: 1px solid var(--rule); background: var(--surface); color: var(--ink); font-weight: 600;
  font-size: 14px; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--brand-text); padding-inline: 8px; }
.btn.ghost:hover { background: var(--brand-soft); }
.btn.danger { color: var(--over); background: transparent; border-color: transparent; }
.btn.danger.armed { background: var(--over); color: var(--on-over); border-color: var(--over); }
.btn.sm { min-height: 32px; padding: 5px 11px; font-size: 13.5px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; font-stretch: 85%; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
.pill.over { background: var(--over-soft); color: var(--over); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.mute { background: var(--surface-2); color: var(--ink-2); }
.fchips { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
.fchip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); border-radius: 999px;
  padding: 5px 11px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.fchip .n { font-variant-numeric: tabular-nums; color: var(--ink-3); font-weight: 600; }
.fchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.fchip[aria-pressed="true"] .n { color: var(--surface); opacity: .7; }
.fchip[disabled] { opacity: .45; cursor: default; }
.filters { display: grid; gap: 8px; }
.frow { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: start; gap: 10px; }
.frow .flabel { font-stretch: 80%; font-size: 13px; color: var(--ink-2); letter-spacing: .015em; padding-top: 6px; }
.frow .fchips { margin: 0; }
.cdot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--co, var(--ink-3)); flex: none; }
.cdot.uc { --co: var(--co-uc); } .cdot.asf { --co: var(--co-asf); }
.gdot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; flex: none; background: var(--gc, var(--ink-3)); }
.g-cleared { --gc: var(--g-cleared); } .g-review { --gc: var(--g-review); } .g-revise { --gc: var(--g-revise); }
.g-send { --gc: var(--g-send); } .g-void { --gc: var(--g-void); } .g-other { --gc: var(--g-other); } .g-overdue { --gc: var(--over); }
.gdot.g-overdue { border-radius: 50%; }

/* status chip: the Legend's own colors */
.stchip { display: inline-flex; align-items: center; max-width: 100%; padding: 2px 8px; border-radius: 4px; font-size: 12.5px; font-weight: 700; font-stretch: 86%;
  line-height: 1.35; background: var(--f, var(--surface-2)); color: var(--t, var(--ink-2)); border: 1px solid var(--b, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stchip.ol { background: transparent; color: var(--t); border-color: currentColor; }
.stchip.none { font-weight: 600; font-style: italic; color: var(--ink-3); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stchip.ol { color: var(--t2, var(--t)); } }
:root[data-theme="dark"] .stchip.ol { color: var(--t2, var(--t)); }

/* ---------- status bar ---------- */
.sbar { display: flex; gap: 2px; height: 14px; margin: 2px 0 4px; }
.sbar > span { display: block; min-width: 3px; height: 100%; background: var(--gc); }
.sbar > span:first-child { border-radius: 4px 0 0 4px; }
.sbar > span:last-child { border-radius: 0 4px 4px 0; }
.sbar > span:only-child { border-radius: 4px; }
.sbar.empty > span { background: var(--track); }
.sbar.thin { height: 8px; }

/* ---------- stats strip ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px 22px; margin-top: 16px; }
.stat .k { display: flex; align-items: center; gap: 7px; font-stretch: 80%; font-size: 13px; color: var(--ink-2); letter-spacing: .015em; }
.stat .v { font-size: 22px; font-weight: 700; margin-top: 2px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }
.stat .s.over { color: var(--over); font-weight: 600; }

/* ---------- attention ---------- */
.attn-tabs { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- lists ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.toolbar .grow { flex: 1 1 220px; min-width: 0; }
.search { width: 100%; min-height: 38px; border: 1px solid var(--rule); border-radius: var(--r-ctl); background: var(--surface); padding: 7px 12px; }
.sortsel { min-height: 38px; border: 1px solid var(--rule); border-radius: var(--r-ctl); background: var(--surface); padding: 7px 10px; max-width: 100%; }
.sortwrap { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13.5px; flex: none; }
.logtools { flex-wrap: nowrap; }
.logtools .grow { flex: 1 1 auto; }
.list-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 12px; color: var(--ink-2); font-size: 13.5px; }
.empty { text-align: left; padding: 22px 4px; color: var(--ink-2); }
.empty b { color: var(--ink); }

/* ---------- submittal rows ---------- */
.slist { container-type: inline-size; container-name: sl; margin-top: 8px; }
.srow { display: grid; grid-template-columns: 58px minmax(0, 1fr) minmax(168px, 220px) 66px; grid-template-areas: "sn sm st sd" "sn nt nt sd";
  gap: 3px 14px; width: calc(100% + 16px); margin-inline: -8px; padding: 11px 8px; text-align: left; border: 0; border-bottom: 1px solid var(--rule);
  background: transparent; border-radius: 6px; align-items: start; color: inherit; }
.srow:last-child { border-bottom: 0; }
.srow:hover { background: var(--surface-2); }
.srow .sn { grid-area: sn; display: grid; line-height: 1.2; }
.srow .sn b { font-size: 16px; font-weight: 800; font-stretch: 92%; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.srow .sn small, .srow .sd small { font-size: 12px; color: var(--ink-3); font-stretch: 88%; }
.srow .sm { grid-area: sm; min-width: 0; }
.srow .pj { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-2); font-stretch: 90%; margin-bottom: 1px; overflow-wrap: anywhere; }
.srow .t { display: block; font-weight: 600; overflow-wrap: anywhere; }
.srow .s { display: flex; flex-wrap: wrap; gap: 2px 10px; color: var(--ink-3); font-size: 13px; margin-top: 2px; }
.srow .st { grid-area: st; display: grid; gap: 4px; justify-items: start; min-width: 0; padding-top: 1px; }
.srow .dt { color: var(--ink-3); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.srow .dt .fu { color: var(--ink-2); }
.srow .sd { grid-area: sd; text-align: right; display: grid; line-height: 1.15; justify-items: end; }
.srow .sd b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.srow .sd.quiet b { color: var(--ink-3); font-size: 15px; font-weight: 600; }
.srow .sd.over b { color: var(--over); }
.srow .sd .pill { margin-top: 4px; }
.srow .nt { grid-area: nt; color: var(--ink-2); font-size: 13px; font-style: italic; white-space: pre-line; overflow-wrap: anywhere; }
.srow.is-over { box-shadow: inset 3px 0 0 var(--over); }
@container sl (max-width: 640px) {
  .srow { grid-template-columns: 46px minmax(0, 1fr) auto; grid-template-areas: "sn sm sd" "sn st sd" "sn nt sd"; gap: 4px 10px; }
  .srow .st { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .srow .sn b { font-size: 15px; }
}

/* ---------- checks, activity ---------- */
.chk { display: grid; gap: 2px; width: calc(100% + 16px); margin-inline: -8px; padding: 10px 8px; text-align: left; border: 0; border-bottom: 1px solid var(--rule); background: transparent; border-radius: 6px; color: inherit; }
.chk:last-child { border-bottom: 0; }
.chk:hover { background: var(--surface-2); }
.chk .t { font-weight: 600; overflow-wrap: anywhere; }
.chk .d { color: var(--ink-2); font-size: 13.5px; }
.aday { font-weight: 700; font-size: 13.5px; color: var(--ink-2); padding: 14px 0 4px; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.aday:first-child { padding-top: 0; }
.arow { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 3px 12px; width: calc(100% + 16px); margin-inline: -8px; padding: 10px 8px; text-align: left; border: 0;
  border-bottom: 1px solid var(--rule); background: transparent; border-radius: 6px; color: inherit; align-items: start; }
.arow:hover { background: var(--surface-2); }

.arow .by { color: var(--ink-3); font-size: 12.5px; }
.ev { display: inline-flex; justify-self: start; align-items: center; border-radius: 4px; padding: 1px 7px; font-size: 12.5px; font-weight: 700; font-stretch: 88%;
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.ev.e-follow { background: var(--warn-soft); color: var(--warn); }
.ev.e-sent { background: var(--g-review-soft); color: var(--g-review); }
.ev.e-returned { background: var(--good-soft); color: var(--good); }
.ev.e-revision { background: var(--g-revise-soft); color: var(--g-revise); }
.ev.e-status, .ev.e-note { background: var(--track); color: var(--ink-2); }

/* ---------- projects ---------- */
.pgroup { display: grid; gap: 10px; }
.pgroup-head { display: flex; align-items: baseline; gap: 10px; }
.pgroup-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
.pgroup-head .n { color: var(--ink-3); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 272px), 1fr)); gap: 14px; }
.pcard { text-align: left; border: 1px solid var(--rule); background: var(--surface); border-radius: var(--r-card); padding: 14px 16px 13px;
  display: grid; gap: 8px; align-content: start; color: inherit; font: inherit; width: 100%; min-width: 0; }
.pcard:hover { border-color: var(--ink-3); }
.pcard .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; min-height: 21px; }
.pcard .job { font-stretch: 78%; font-weight: 700; font-size: 13px; color: var(--ink-2); letter-spacing: .03em; overflow-wrap: anywhere; }
.pcard .name { font-weight: 700; font-size: 16.5px; line-height: 1.25; overflow-wrap: anywhere; text-wrap: balance; }
.pcard .row { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pcard .row > span:first-child { display: inline-flex; align-items: center; gap: 7px; }
.pcard .row b { color: var(--ink); font-weight: 700; text-align: right; }
.pcard .row b.over { color: var(--over); }
.pcard .foot { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12.5px; color: var(--ink-3); border-top: 1px solid var(--rule); padding-top: 8px; margin-top: 2px; }
.pcard .foot .w { color: var(--warn); font-weight: 600; }
.pcard.closed .name, .pcard.closed .row b { color: var(--ink-2); }
.pcard[data-co] { border-top: 4px solid var(--co); padding-top: 11px; }
.pcard[data-co="uc"] { --co: var(--co-uc); } .pcard[data-co="asf"] { --co: var(--co-asf); }
.pcard .co { margin-top: -5px; font-size: 13px; font-weight: 600; font-stretch: 90%; color: var(--ink-2); overflow-wrap: anywhere; }
.pcard .gc { margin-top: -5px; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.pcard .gc .k { font-stretch: 78%; font-weight: 700; font-size: 12px; letter-spacing: .03em; color: var(--ink-3); margin-right: 6px; }
details.pmore > summary { list-style: none; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
details.pmore > summary::-webkit-details-marker { display: none; }
details.pmore > summary::before { content: "\25B8"; color: var(--ink-3); font-size: 13px; transition: transform .15s; }
details.pmore[open] > summary::before { transform: rotate(90deg); }
details.pmore[open] > .pgrid { margin-top: 10px; }
.pempty { display: grid; gap: 12px; justify-items: start; }
.pempty p { margin: 0; color: var(--ink-2); max-width: 62ch; }
@media (max-width: 560px) {
  .ptools { display: grid; gap: 10px; }
  .ptools .btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ptools .btnrow .btn { white-space: normal; text-align: center; }
  .ptools .btnrow .primary { grid-column: 1 / -1; order: -1; }
}

/* ---------- forms & modal ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; }
.modal-back { position: absolute; inset: 0; background: var(--scrim); }
.modal-card:focus { outline: none; }
.modal-card { position: relative; width: min(620px, 100%); max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px); display: flex; flex-direction: column;
  background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 12px; border-bottom: 1px solid var(--rule); }
.modal-head h2 { margin: 0; font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
.icon-btn { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 8px; font-size: 22px; line-height: 1; color: var(--ink-2); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.modal form { overflow-y: auto; overscroll-behavior: contain; min-height: 0; padding: 16px 20px 0; display: flex; flex-direction: column; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 14px; align-items: start; }
.field { display: grid; gap: 5px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label, .field .label { font-weight: 600; font-size: 13.5px; color: var(--ink-2); }
.field input, .field select, .field textarea { width: 100%; min-height: 40px; border: 1px solid var(--rule); border-radius: var(--r-ctl);
  background: var(--surface); padding: 8px 11px; }
.field textarea { min-height: 64px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand-text); outline: 2px solid color-mix(in srgb, var(--brand-text) 28%, transparent); outline-offset: 0; }
.field input[disabled], .field select[disabled], .field textarea[disabled] { opacity: 1; color: var(--ink); background: var(--surface-2); }
.field .hint { font-size: 12.5px; color: var(--ink-3); min-height: 0; }
.field .hint:empty { display: none; }
.field .hint.warn { color: var(--warn); }
.field.invalid input, .field.invalid textarea { border-color: var(--over); }
.field.flash input, .field.flash select { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--brand-soft); border-color: var(--brand-text); } 100% { box-shadow: none; } }
.form-note { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.form-note.warn { background: var(--warn-soft); color: var(--ink); }
.form-total { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 9px 12px; min-height: 40px;
  border-radius: var(--r-ctl); background: var(--surface-2); font-variant-numeric: tabular-nums; }
.form-total b { font-size: 17px; }
.form-total.over { background: var(--over-soft); color: var(--over); }
.form-actions { position: sticky; bottom: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 14px 0 16px; margin-top: 16px; background: var(--surface); border-top: 1px solid var(--rule); }
.form-actions .r { display: flex; gap: 8px; margin-left: auto; }
.form-err { color: var(--over); font-size: 13.5px; grid-column: 1 / -1; }
.form-err:empty { display: none; }
.sstrip { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: 13.5px; color: var(--ink-2); }
.sstrip b { color: var(--ink); font-variant-numeric: tabular-nums; }
.qa { grid-column: 1 / -1; display: grid; gap: 8px; }
.qa .label { font-weight: 600; font-size: 13.5px; color: var(--ink-2); }
.qa .btnrow { gap: 6px; }
.qa .btn { min-height: 34px; }
.qa .done { font-size: 13px; color: var(--brand-text); font-weight: 600; }
.hist { display: grid; }
.hrow { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 2px 10px; padding: 9px 6px; margin-inline: -6px; border: 0; border-bottom: 1px solid var(--rule);
  background: transparent; text-align: left; border-radius: 6px; color: inherit; }
.hrow:hover { background: var(--surface-2); }
.hrow:last-child { border-bottom: 0; }
.hrow .d { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.hrow .m { display: grid; gap: 2px; min-width: 0; }
.hrow .n { font-size: 14px; white-space: pre-line; overflow-wrap: anywhere; }
.hrow .by { font-size: 12.5px; color: var(--ink-3); }

/* ---------- settings ---------- */
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.steps { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 8px; color: var(--ink-2); }
.steps b { color: var(--ink); }
details summary { cursor: pointer; font-weight: 700; }
.connect { max-width: 680px; margin: 0 auto; display: grid; gap: 16px; }
.connect .lead { color: var(--ink-2); margin: 6px 0 16px; }
.inline-form { display: grid; gap: 14px; }
.inline-form .fields { gap: 14px; }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 9px; font-weight: 600; font-size: 14px;
  box-shadow: var(--shadow); max-width: calc(100% - 32px); }

/* ---------- responsive ---------- */
@media (max-width: 760px) {
  .sign .wrap { padding-block: 18px 16px; }
  .sign h1 { font-size: 21px; font-stretch: 100%; }
  .sign .co .cl { display: none; }
  .sign .co .cs { display: inline; }
  .tabs { display: none; }
  .tabbar { display: grid; grid-template-columns: repeat(3, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--surface); border-top: 1px solid var(--rule); padding: 4px max(6px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
  .tabbar[hidden] { display: none; }
  .tabbar button { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; padding: 6px 1px 4px; color: var(--ink-3);
    font-size: 11.5px; font-weight: 600; border-radius: 8px; min-width: 0; }

  .tabbar button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tabbar button[aria-current="page"] { color: var(--brand-text); }
  .main { padding-block: 16px 40px; }

  body.has-tabbar .toast { bottom: calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom, 0px)); }
  .card { padding: 15px 14px; }
  .fields { grid-template-columns: 1fr; }
  .fields .half { grid-column: auto; }
  .modal { padding: 0; place-items: end stretch; }
  .modal-card { width: 100%; max-height: 92vh; max-height: 92dvh; border-radius: 14px 14px 0 0; }
  .modal form { padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .modal-head { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .field input, .field select, .field textarea, .search, .sortsel { font-size: 16px; }
  .arow { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fchips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -14px; padding: 0 14px 2px; }
  .fchips.scroll::-webkit-scrollbar { display: none; }
  .sortwrap .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .sortsel { width: 124px; }
}
@media (max-width: 760px) { .fields.pair { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- print: the log as the old workbook laid it out ---------- */
#print { display: none; }
@media print {
  @page { size: letter landscape; margin: .35in; }
  html, body { background: #fff !important; }
  body::before { display: none; }
  body > *:not(#print) { display: none !important; }
  #print { display: block; color: #000; font: 8.5pt/1.3 Arial, Helvetica, sans-serif; }
  #print * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #print .ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; border-bottom: 2px solid #1f3864; padding-bottom: 6px; margin-bottom: 8px; }
  #print .kick { font-size: 8pt; letter-spacing: .12em; font-weight: 700; color: #1f3864; text-transform: uppercase; }
  #print h1 { font-size: 15pt; margin: 2px 0 0; color: #1f3864; text-transform: uppercase; }
  #print .meta { font-size: 8.5pt; text-align: right; }
  #print .meta b { color: #1f3864; }
  #print .counts { display: flex; gap: 0; margin: 0 0 8px; border: 1px solid #9aa7b4; }
  #print .counts div { flex: 1; padding: 4px 8px; border-right: 1px solid #9aa7b4; }
  #print .counts div:last-child { border-right: 0; }
  #print .counts span { display: block; font-size: 7pt; letter-spacing: .06em; text-transform: uppercase; color: #444; }
  #print .counts b { font-size: 12pt; }
  #print .filt { margin: 0 0 6px; font-style: italic; }
  #print table { border-collapse: collapse; width: 100%; }
  #print thead { display: table-header-group; }
  #print tr { break-inside: avoid; }
  #print th { background: #2e5fa3; color: #fff; font-weight: 700; text-align: left; padding: 3px 4px; border: 1px solid #2e5fa3; font-size: 7.5pt; }
  #print td { border: 1px solid #b7c0c9; padding: 3px 4px; vertical-align: top; }
  #print td.c, #print th.c { text-align: center; }
  #print td.n { text-align: right; font-variant-numeric: tabular-nums; }
  #print td.od { background: #7b0000; color: #fff; font-weight: 700; }
  #print td.cm { white-space: pre-line; }
  #print tr.tot td { font-weight: 700; background: #eef1f5; }
  #print .foot { margin-top: 6px; font-size: 7.5pt; color: #555; }
}
</style>

        '<td class="n' + (x.overdue ? ' od' : '') + '">' + (s.dateSent ? x.days : 0) + '</td><td class="cm">' + esc(s.comments) + '</td></tr>';
    }).join('') + '</tbody></table>' +
    '<div class="foot">Days Open counts from the date sent to the date returned, or to today while under review. Overdue: under review ' + m.od + ' days or more.</div>';
  printHtml(h);
}
function printSummary() {
  var m = model(), list = shownProjects().filter(function (p) { return p.status !== 'Closed'; }), tot = blankCounts();
  var fn = filterNote();
  var h = '<div class="ph"><div><div class="kick">Submittal control</div><h1>All projects</h1></div><div class="meta"><b>As of</b> ' + fmtUS(m.today) + '<br>' + list.length + ' open ' + plural(list.length, 'project') +
    (fn ? '<br>' + esc(fn) : '') + '</div></div>' +
    '<table><thead><tr><th>Project Name</th><th>Project No.</th><th>GC / Recipient</th><th class="c">Total</th><th class="c">Cleared</th><th class="c">Under Review</th><th class="c">Overdue</th>' +
    '<th class="c">Revise</th><th class="c">To Send</th><th>Estimator</th><th>PM</th><th>Status</th></tr></thead><tbody>' +
    list.map(function (p) {
      var c = m.by[p.id].counts;
      Object.keys(tot).forEach(function (k) { tot[k] += c[k]; });
      return '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.number) + '</td><td>' + esc(p.gc) + '</td><td class="n">' + c.total + '</td><td class="n">' + c.cleared + '</td><td class="n">' + c.review + '</td>' +
        '<td class="n' + (c.overdue ? ' od' : '') + '">' + c.overdue + '</td><td class="n">' + c.revise + '</td><td class="n">' + c.send + '</td><td>' + esc(p.estimator) + '</td><td>' + esc(p.pm) + '</td><td>' + esc(statusLabel(p.status)) + '</td></tr>';
    }).join('') +
    '<tr class="tot"><td colspan="3">Total</td><td class="n">' + tot.total + '</td><td class="n">' + tot.cleared + '</td><td class="n">' + tot.review + '</td><td class="n">' + tot.overdue + '</td><td class="n">' + tot.revise + '</td><td class="n">' + tot.send + '</td><td colspan="3"></td></tr>' +
    '</tbody></table><div class="foot">Overdue: under review ' + m.od + ' days or more. Closed projects are left out.</div>';
  printHtml(h);
}

/* =========================================================== toast */
var toastTimer = null;
function toast(msg, ms) {
  var el = $('#toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.hidden = true; }, ms || 2600);
}

/* =========================================================== links and connecting */
function setupLink(o) {
  var payload = btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return location.origin + location.pathname + '#connect=' + payload;
}
function copyText(text, msg) {
  var done = function () { toast(msg, 4200); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { window.prompt('Copy this link', text); });
  else window.prompt('Copy this link', text);
}
function decodeLink(text) {
  var m = /#connect=([\w-]+)/.exec(text || '');
  if (!m) return null;
  try {
    var o = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')))));
    if (!o || typeof o.u !== 'string' || typeof o.k !== 'string') return null;
    return { u: o.u, k: o.k };
  } catch (e) { return null; }
}
function resetLocal() {
  store.del(KEYS.cache); store.del(KEYS.outbox);
  state.outbox = []; state.base = null; state.data = normData(null); state.ready = false; state.loadedAt = 0;
  state.server = { access: '', name: '', sheetUrl: '', version: '', tz: '', missing: [], viewKey: '' };
  bump();
}
function connect(f) {
  var url = $('#f_url', f).value.trim(), key = $('#f_key', f).value.trim(), err = $('#connectErr'), btn = $('#connectBtn');
  var pasted = decodeLink(url);
  if (pasted) { url = pasted.u; key = pasted.k; $('#f_url', f).value = url; $('#f_key', f).value = key; }
  if (!/^https:\/\/script\.google\.com\/.*\/s\/[\w-]+\/(exec|dev)\/?$/.test(url)) {
    err.textContent = 'Paste the web app URL from Deploy > Manage deployments. It starts with https://script.google.com/macros/s/ and ends in /exec.'; return;
  }
  if (/\/dev\/?$/.test(url)) { err.textContent = 'That is the test URL ending in /dev. Use the deployment URL that ends in /exec.'; return; }
  if (!key) { err.textContent = 'Enter the access key. In the Google Sheet: Submittal Control > Show access keys.'; return; }
  if (/\s/.test(key)) { err.textContent = 'The access key has no spaces. Copy it again from Submittal Control > Show access keys.'; return; }
  err.textContent = '';
  btn.disabled = true; btn.textContent = 'Connecting';
  var prev = state.conn, pinged = false;
  state.conn = { url: url.replace(/\/$/, ''), key: key };
  call('ping').then(function (p) {
    pinged = true;
    resetLocal();
    gotServer(p);
    store.set(KEYS.conn, state.conn);
    state.pendingConn = null;
    go('#projects');
    render();
    return load().then(function () { toast('Connected to "' + (p.name || 'your sheet') + '"' + (p.access === 'view' ? ', view only' : '')); });
  }).catch(function (e2) {
    if (pinged) return;
    state.conn = prev;
    btn = $('#connectBtn'); err = $('#connectErr');
    if (btn) { btn.disabled = false; btn.textContent = 'Connect'; }
    if (err) err.textContent = e2 && e2.code === 'bad_key' ? 'The sheet didn\'t accept that access key. Copy it again from Submittal Control > Show access keys.' : (e2 && e2.message) || 'Could not connect.';
  });
}
function readHashConnect() {
  if (!/#connect=/.test(location.hash || '')) return null;
  var o = decodeLink(location.hash);
  replaceHash(location.pathname + location.search + '#projects');
  return o;
}
function takeLink(link) {
  if (!link) return 'none';
  var c = state.conn;
  if (c && c.url === link.u && c.key === link.k) return 'same';
  if (c && c.url === link.u) {   // the same sheet with a new key: keep this device's copy and its waiting changes
    c.key = link.k; store.set(KEYS.conn, c);
    state.server.access = ''; state.server.viewKey = ''; state.pendingConn = null;
    return 'rekey';
  }
  if (c && state.outbox.length) { state.pendingConn = link; return 'pending'; }
  state.conn = null; state.pendingConn = link; state.outbox = [];
  return 'switch';
}
function restoreLocal() {
  var c = state.conn, cache = store.get(KEYS.cache), ob = store.get(KEYS.outbox);
  if (ob && ob.url === c.url && Array.isArray(ob.ops)) state.outbox = ob.ops;
  if (cache && cache.url === c.url && cache.base) {
    state.server = Object.assign(state.server, cache.server || {});
    if (cache.key !== c.key) state.server.access = '';
    state.base = normData(cache.base);
    state.data = withOutbox(state.base);
    state.loadedAt = cache.at || 0;
    state.ready = true;
    bump();
  }
}

/* =========================================================== events */
var armed = null;
function arm(btn, label, fn) {
  if (armed && armed.btn === btn) { clearTimeout(armed.t); armed = null; fn(); return; }
  if (armed) { armed.btn.classList.remove('armed'); armed.btn.textContent = armed.label; clearTimeout(armed.t); }
  var old = btn.textContent;
  btn.classList.add('armed'); btn.textContent = label;
  armed = { btn: btn, label: old, t: setTimeout(function () { btn.classList.remove('armed'); btn.textContent = old; armed = null; }, 4000) };
}
/** Has anything in the open form been changed since it opened? */
function formDirty() {
  return $$('input[name], select[name], textarea[name]', $('#modalForm')).some(function (el) {
    if (el.disabled) return false;
    if (el.tagName === 'SELECT') {
      var any = Array.prototype.some.call(el.options, function (o) { return o.defaultSelected; });
      return any ? !el.options[el.selectedIndex].defaultSelected : el.selectedIndex > 0;
    }
    return el.value !== el.defaultValue;
  });
}
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  var a = el.dataset.action, r = state.route;
  if (a === 'projects') go('#projects');
  else if (a === 'open-project') go(hashOf({ view: 'project', pid: el.dataset.id, tab: 'log' }));
  else if (a === 'tab') go(hashOf({ view: 'project', pid: r.pid, tab: el.dataset.tab }));
  else if (a === 'open-sub') formSubmittal(el.dataset.id);
  else if (a === 'new-sub') formSubmittal(null, r.pid);
  else if (a === 'new-project') formNewProject();
  else if (a === 'filter') { state.ui.f = el.dataset.clear ? '' : state.ui.f === el.dataset.f ? '' : el.dataset.f; if (el.dataset.clear) state.ui.q = ''; render(); }
  else if (a === 'af') { state.ui.af = el.dataset.f; render(); }
  else if (a === 'attn') { state.ui.attn = el.dataset.v; state.ui.attnAll = false; saveUi(); render(); }
  else if (a === 'attn-all') { state.ui.attnAll = !state.ui.attnAll; render(); }
  else if (a === 'co-filter' || a === 'pm-filter') {
    var fk = a === 'co-filter' ? 'coFilter' : 'pmFilter', ck = el.dataset.k;
    state.ui[fk] = ck === '*' || state.ui[fk] === ck ? null : ck;
    render();
  }
  else if (a === 'clear-filters') { state.ui.coFilter = null; state.ui.pmFilter = null; render(); }
  else if (a === 'qa') quickFill(el);
  else if (a === 'log-hist') {
    if (formDirty()) { showFormErr('Save or cancel your changes to the submittal first.'); return; }
    formHistory(null, el.dataset.id, el.dataset.kind);
  }
  else if (a === 'edit-hist') {
    if (!$('#modal').hidden && formDirty()) { showFormErr('Save or cancel your changes to the submittal first.'); return; }
    formHistory(el.dataset.id);
  }
  else if (a === 'print-log') { var p = findProject(r.pid); if (p) printLog(p); }
  else if (a === 'print-summary') printSummary();
  else if (a === 'delete-project') {
    var pp = findProject(r.pid);
    if (pp) arm(el, 'Tap again to delete the project', function () { commit([del('projects', pp.id)], '"' + pp.name + '" deleted'); go('#projects'); });
  }
  else if (a === 'sync-info') { var cc = $('#connCard'); if (cc) cc.scrollIntoView({ block: 'start', behavior: 'smooth' }); else if (state.conn && r.view === 'project') go(hashOf({ view: 'project', pid: r.pid, tab: 'settings' })); }
  else if (a === 'pending-dismiss') { state.pendingConn = null; renderBanner(); }
  else if (a === 'pending-connect') {
    var n = state.outbox.length;
    arm(el, 'Tap again: ' + n + ' ' + plural(n, 'change') + ' will be lost', function () {
      var link = state.pendingConn;
      resetLocal(); store.del(KEYS.conn); state.conn = null; state.pendingConn = link;
      render();
      var f = $('#connectForm'); if (f) connect(f);
    });
  }
  else if (a === 'close-modal') { if (!form.busy) closeModal(); }
  else if (a === 'form-delete') { var fn = form.spec && form.spec.onDelete; if (fn) arm(el, 'Tap again to delete', function () { closeModal(); fn(); }); }
  else if (a === 'reload') { if (state.conn) load().then(function () { toast('Loaded from the sheet'); }, function () { toast('Could not load the sheet'); }); }
  else if (a === 'setup-tabs') {
    el.disabled = true;
    queueNet(function () { return call('setup', {}, { timeout: 150000 }); }).then(function (res) { gotServer(res); setBase(res.data); setSync(syncIdle()); render(); toast('The Google Sheet is set up'); flushSoon(); },
      function (err) { el.disabled = false; toast((err && err.message) || 'Could not set up the sheet', 6000); });
  }
  else if (a === 'copy-link') copyText(setupLink({ u: state.conn.url, k: state.conn.key }), 'Link copied. Send it privately: it includes the access key.');
  else if (a === 'copy-view-link') copyText(setupLink({ u: state.conn.url, k: state.server.viewKey }), 'View-only link copied. It can look at every log but not change anything.');
  else if (a === 'show-key') { var k = $('#keyShown'); if (k) k.textContent = state.conn.key; }
  else if (a === 'reset-preview') {
    arm(el, 'Tap again to reset', function () { store.del(KEYS.preview); state.data = normData(SEED); bump(); go('#projects'); render(); toast('Preview reset to the workbook data'); });
  }
  else if (a === 'disconnect') {
    arm(el, state.outbox.length ? 'Tap again, ' + state.outbox.length + ' changes will be lost' : 'Tap again to disconnect', function () {
      resetLocal(); store.del(KEYS.conn); state.conn = null;
      setSync('idle'); go('#projects'); render(); toast('This device is disconnected');
    });
  }
});
document.addEventListener('submit', function (e) {
  var f = e.target;
  e.preventDefault();
  if (f.id === 'modalForm' && form.spec) {
    if (form.busy) return;
    showFormErr('');
    var spec = form.spec, res = spec.onSubmit(f);
    if (typeof res === 'string') { showFormErr(res); return; }
    if (res === false) return;
    if (form.spec === spec) closeModal();
  } else if (f.id === 'projectForm') saveProject(f);
  else if (f.id === 'appForm') saveApp(f);
  else if (f.id === 'connectForm') connect(f);
});
document.addEventListener('input', function (e) {
  var id = e.target.id;
  if (id === 'pSearch' || id === 'qSearch') {
    if (id === 'pSearch') state.ui.pSearch = e.target.value; else state.ui.q = e.target.value;
    var pos = e.target.selectionStart;
    render();
    var s = $('#' + id); if (s) { s.focus(); try { s.setSelectionRange(pos, pos); } catch (x) { /* ignore */ } }
  }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'sortSel') { state.ui.sort = e.target.value; saveUi(); render(); var s = $('#sortSel'); if (s) s.focus(); }
});
document.addEventListener('toggle', function (e) { if (e.target && e.target.id === 'closedGroup') state.ui.showClosed = e.target.open; }, true);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#modal').hidden && !form.busy) closeModal(); });
window.addEventListener('hashchange', function () {
  if (!PREVIEW && /#connect=/.test(location.hash || '')) {
    var r = takeLink(readHashConnect());
    if (r === 'pending') renderBanner();
    else if (r === 'switch') { resetLocal(); render(); var cf = $('#connectForm'); if (cf) connect(cf); }
    else if (r === 'rekey') { onRoute(); load().then(function () { flush(); toast('Connected with the new key'); }, noop); }
    else onRoute();
    return;
  }
  onRoute();
});

/* =========================================================== boot */
function boot() {
  if (PREVIEW) {
    var saved = store.get(KEYS.preview);
    state.conn = { url: 'preview', key: '' };
    state.server = { access: 'full', name: 'Preview', sheetUrl: '', version: SCHEMA.version, tz: '', missing: [], viewKey: '' };
    state.data = normData(saved && saved.projects ? saved : SEED);
    state.ready = true; state.loadedAt = Date.now(); bump();
    state.route = routeOf(location.hash);
    if (!location.hash || location.hash === '#') replaceHash('#projects');
    setSync('preview');
    render();
    return;
  }
  var link = readHashConnect();
  state.conn = store.get(KEYS.conn);
  if (state.conn) restoreLocal();
  var took = takeLink(link);
  state.route = routeOf(location.hash);
  if (!location.hash || location.hash === '#') replaceHash('#projects');
  if (took === 'switch') resetLocal();
  render();
  if (state.conn) {
    load({ quiet: state.ready }).then(function () { flush(); }, noop);
  } else if (state.pendingConn) { var f = $('#connectForm'); if (f) connect(f); }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || !state.conn || flushing) return;
    if (state.outbox.length) { flush(); return; }
    if (Date.now() - state.loadedAt > 30000) load({ quiet: true }).catch(noop);
  });
  window.addEventListener('online', function () {
    if (!state.conn) return;
    if (state.outbox.length) flush(); else load({ quiet: true }).catch(noop);
  });
  setInterval(function () {
    if (document.visibilityState !== 'visible' || !state.conn || flushing || state.outbox.length || !$('#modal').hidden) return;
    if (Date.now() - state.loadedAt > 180000) load({ quiet: true }).catch(noop);
  }, 30000);
}
window.__sc = { state: state, model: model, fmtSub: fmtSub, historyFor: historyFor, daysOpen: daysOpen };
boot();
})();
